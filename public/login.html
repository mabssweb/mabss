<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Login - MABSS Admission</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid #006400;
        }

        h1 {
            color: #006400;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #006400;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #004d00;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            display: none;
        }

        .success {
            color: green;
            margin-bottom: 10px;
            display: none;
        }

        .links {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        a {
            color: #006400;
            text-decoration: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #666;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider span {
            padding: 0 10px;
            font-size: 0.9rem;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: #444;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .google-btn:hover {
            background: #f8f8f8;
            border-color: #ccc;
        }

        .google-btn svg {
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h1>Student Login</h1>
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <!-- Google Sign-In Button Container -->
        <div id="googleButtonDiv" style="margin-bottom: 20px;"></div>

        <div class="divider">
            <span>OR</span>
        </div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            <p><a href="index.html">Back to Home</a></p>
        </div>
    </div>

    <!-- Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        // Google Sign-In Callback
        async function handleGoogleCallback(response) {
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();

                if (res.ok) {
                    if (data.isNewUser) {
                        successDiv.textContent = 'Account created successfully! Redirecting...';
                        successDiv.style.display = 'block';
                    }

                    // Redirect based on role
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirect = urlParams.get('redirect');

                        if (data.user.role === 'admin') {
                            window.location.href = 'admin/admissions.html';
                        } else if (redirect === 'admission') {
                            window.location.href = 'admission/index.html';
                        } else {
                            window.location.href = 'admission/index.html';
                        }
                    }, 1000);
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                errorDiv.textContent = err.message || 'Google sign-in failed';
                errorDiv.style.display = 'block';
            }
        }

        // Initialize Google Sign-In when page has loaded
        // Initialize Google Sign-In when page has loaded
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "1066040941987-6fotl7k1qvcgtb3snt87lr4i1ujm21oj.apps.googleusercontent.com",
                callback: handleGoogleCallback,
                // FedCM is enabled by default, so we don't need to explicitly set it to true
                use_fedcm_for_prompt: false // Disable FedCM to fix localhost network errors
            });

            // Render the button in the div
            // Width must be an integer (pixels), "100%" is invalid
            google.accounts.id.renderButton(
                document.getElementById("googleButtonDiv"),
                { theme: "outline", size: "large", width: 350 }
            );

            google.accounts.id.prompt();
        };

        // Regular form login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerText = 'Logging in...';
            errorDiv.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // Check for redirect parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');

                    // Role-based redirect
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin/admissions.html';
                    } else if (redirect === 'admission') {
                        window.location.href = 'admission/index.html';
                    } else {
                        window.location.href = 'admission/index.html';
                    }
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Login';
            }
        });
    </script>
</body>

</html>
