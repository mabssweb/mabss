<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <title>MABSS Admin - News Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            padding-top: 90px;
        }

        .header {
            background-color: #0e7704;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 0.5rem 0;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .helo {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
        }

        .school-name {
            margin: 0;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
        }

        .nav-menu {
            display: flex;
            align-items: center;
        }

        .nav-list {
            display: flex;
            list-style: none;
            margin: 0;
            padding-left: 50px;
            gap: 1rem;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 0.8rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .admin-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        .admin-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .admin-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #0e7704;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #006341;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }

        .image-upload {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .image-upload:hover {
            border-color: #0e7704;
        }

        .image-upload i {
            font-size: 3rem;
            color: #0e7704;
            margin-bottom: 1rem;
        }

        .image-upload p {
            color: #666;
        }

        .submit-btn {
            background-color: #0e7704;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #004d33;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .rich-editor {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0.5rem;
            min-height: 200px;
        }

        .editor-toolbar {
            background-color: #f9f9f9;
            border-bottom: 1px solid #ddd;
            padding: 0.5rem;
        }

        .editor-btn {
            background: none;
            border: none;
            padding: 0.5rem;
            margin-right: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .editor-btn:hover {
            background-color: #e9f7e9;
        }

        .editor-btn.active {
            background-color: #0e7704;
            color: white;
        }

        /* Tab Styles */
        .tabs-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: #0e7704;
            background-color: #f0f0f0;
        }

        .tab-btn.active {
            color: #0e7704;
            border-bottom-color: #0e7704;
        }

        /* Responsive Table Container */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 1rem;
        }

        /* Table Styles */
        .news-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .news-table th,
        .news-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .news-table th {
            background-color: #f9f9f9;
            color: #333;
            font-weight: bold;
        }

        .news-thumb {
            width: 60px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .edit-btn {
            background-color: #ffc107;
            color: #333;
        }

        .edit-btn:hover {
            background-color: #e0a800;
            transform: scale(1.05);
        }

        .view-btn {
            background-color: #0e7704;
            color: white;
        }

        .view-btn:hover {
            background-color: #0b5e03;
            transform: scale(1.05);
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .logout-btn {
            background-color: #d32f2f;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            /* Stack buttons vertically */
            gap: 0.3rem;
            align-items: stretch;
            /* Make buttons full width */
        }

        .action-btn {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
            background-color: #2196F3;
            color: white;
            white-space: nowrap;
            /* Prevent text wrapping */
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .action-btn i {
            font-size: 1rem;
        }

        /* Login Styles */
        .login-container {
            max-width: 400px;
            margin: 5rem auto;
            text-align: center;
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 0.8rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-menu {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: #0e7704;
                flex-direction: column;
                align-items: stretch;
                display: none;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            .nav-menu.show {
                display: flex;
            }

            .nav-list {
                flex-direction: column;
                padding: 1rem;
                gap: 0;
            }

            .nav-item {
                margin: 0;
            }

            .nav-link {
                display: block;
                padding: 0.8rem;
            }

            .logout-btn {
                width: 100%;
                margin-top: 0.5rem;
            }

            .school-name {
                font-size: 1.2rem;
            }

            .helo {
                height: 50px;
                width: 50px;
            }

            .admin-section {
                padding: 2rem 1rem;
            }

            .admin-card {
                padding: 1.5rem;
            }

            .admin-title {
                font-size: 1.5rem;
            }

            .tabs-container {
                flex-wrap: wrap;
            }

            .tab-btn {
                padding: 0.8rem 1rem;
                font-size: 1rem;
            }

            .detail-row {
                flex-direction: column;
                gap: 0.2rem;
            }

            .detail-label {
                width: 100%;
                font-size: 0.9rem;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
                padding: 15px;
            }

            .modal-footer {
                flex-direction: column;
            }

            .modal-footer button {
                width: 100% !important;
            }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 900px;
            border-radius: 8px;
        }

        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover {
            color: black;
        }

        .detail-row {
            display: flex;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }

        .detail-label {
            font-weight: bold;
            width: 200px;
            color: #006400;
        }

        .app-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            text-transform: capitalize;
            font-size: 0.85rem;
        }

        .status-pending {
            background: #ff9800;
        }

        .status-accepted {
            background: #4caf50;
        }

        .status-rejected {
            background: #f44336;
        }

        .modal-footer {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }

        .modal-footer button {
            transition: transform 0.2s;
        }

        .modal-footer button:hover {
            transform: translateY(-2px);
        }

        /* Modal Content Layout Enhancements */
        .modal-section {
            margin-bottom: 2rem;
        }

        .modal-section-title {
            color: #0e7704;
            border-bottom: 2px solid #0e7704;
            padding-bottom: 5px;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .document-tag {
            display: inline-flex;
            align-items: center;
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            margin-right: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            transition: background 0.2s;
        }

        .document-tag:hover {
            background: #e0e0e0;
        }

        .document-tag i {
            margin-right: 8px;
            color: #0e7704;
        }

        /* Print Styles */
        @media print {
            body * {
                visibility: hidden;
            }

            #appModal,
            #appModal * {
                visibility: visible;
            }

            #appModal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
            }

            .modal-content {
                box-shadow: none;
                border: none;
                width: 100%;
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .close-modal,
            .modal-footer,
            .print-btn {
                display: none !important;
            }

            .modal-section-title {
                color: black;
                border-color: black;
            }

            .detail-label {
                color: black;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-container">
                <a href="index.html" style="text-decoration:none">
                    <img src="https://res.cloudinary.com/dr7bzccrr/image/upload/v1765345018/logo_mabss_shjvhz.jpg"
                        alt="MABSS Logo" class="helo">
                </a>
                <h1 class="school-name">MABSS Admin</h1>
            </div>
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <nav class="nav-menu" id="mainNav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item" id="admissions-nav" style="display: none;"><a href="#"
                            onclick="switchTab('admissions')" class="nav-link">Admissions</a></li>
                    <li class="nav-item" id="logout-item" style="display: none;">
                        <button onclick="logout()" class="logout-btn">Logout</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Login Section -->
    <section id="login-section" class="admin-section login-container">
        <div class="admin-card">
            <h2 class="admin-title">Admin Login</h2>
            <div id="login-error" class="error-message"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter Admin Password" required>
                </div>
                <button type="submit" class="submit-btn" id="login-btn">Login</button>
            </form>
        </div>
    </section>

    <div class="main-container" style="display: none;">
        <!-- Tabs -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('add-news')">Add News</button>
            <button class="tab-btn" onclick="switchTab('manage-news')">Manage News</button>
            <button class="tab-btn" onclick="switchTab('admissions')">Admissions</button>
        </div>

        <!-- Add News Section -->
        <section id="add-news-section" class="admin-section">
            <div class="admin-card">
                <h2 class="admin-title" id="form-title">Add New News Article</h2>
                <form id="news-form">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label class="form-label" for="title">News Title</label>
                        <input type="text" id="title" class="form-input" placeholder="Enter news title" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="summary">Summary</label>
                        <textarea id="summary" class="form-textarea" placeholder="Brief summary of the news article"
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Content</label>
                        <div class="editor-toolbar">
                            <button type="button" class="editor-btn" onclick="formatText('bold')" title="Bold"><i
                                    class="fas fa-bold"></i></button>
                            <button type="button" class="editor-btn" onclick="formatText('italic')" title="Italic"><i
                                    class="fas fa-italic"></i></button>
                            <button type="button" class="editor-btn" onclick="formatHeading()" title="Heading"><i
                                    class="fas fa-heading"></i></button>
                            <button type="button" class="editor-btn" onclick="insertLink()" title="Insert Link"><i
                                    class="fas fa-link"></i></button>
                            <button type="button" class="editor-btn" onclick="insertImage()" title="Insert Image"><i
                                    class="fas fa-image"></i></button>
                        </div>
                        <div class="rich-editor" id="content-editor" contenteditable="true"
                            placeholder="Write your news content here..."></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Featured Image (Optional)</label>
                        <div class="image-upload" id="upload-zone"
                            onclick="document.getElementById('image-input').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p id="upload-status">Click to upload image (Optional. JPG, PNG, WebP. Max 5MB)</p>
                            <input type="file" id="image-input" name="image" accept="image/jpeg,image/png,image/webp"
                                style="display: none;">
                        </div>
                        <div id="image-preview" style="display: none; margin-top: 1rem; text-align: center;">
                            <img id="preview-img" src="" alt="Preview"
                                style="max-width: 100%; max-height: 200px; border-radius: 8px;">
                            <p id="file-name" style="font-size: 0.8rem; color: #666; margin-top: 0.5rem;"></p>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button type="button" id="cancel-edit-btn" class="submit-btn"
                            style="background-color: #666; display: none;" onclick="resetForm()">Cancel</button>
                        <button type="submit" class="submit-btn" disabled>Publish News Article</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Manage News Section -->
        <section id="manage-news-section" class="admin-section" style="display: none;">
            <div class="admin-card">
                <h2 class="admin-title">Manage Published News</h2>
                <div id="loading-news" style="text-align: center;">Loading...</div>
                <div class="table-responsive">
                    <table class="news-table" id="news-table" style="display: none;">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="news-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Admissions Section -->
        <section id="admissions-section" class="admin-section" style="display: none;">
            <div class="admin-card">
                <h2 class="admin-title">Admissions Management</h2>
                <div style="margin-bottom: 1rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="submit-btn" style="width: auto; padding: 0.5rem 1rem;"
                        onclick="loadApplications('all')">All</button>
                    <button class="submit-btn" style="width: auto; padding: 0.5rem 1rem; background: #ff9800;"
                        onclick="loadApplications('pending')">Pending</button>
                    <button class="submit-btn" style="width: auto; padding: 0.5rem 1rem; background: #4caf50;"
                        onclick="loadApplications('accepted')">Accepted</button>
                </div>
                <div id="loading-apps" style="text-align: center; display: none;">Loading Applications...</div>
                <div class="table-responsive">
                    <table class="news-table" id="apps-table">
                        <thead>
                            <tr>
                                <th>App No</th>
                                <th>Name</th>
                                <th>Class</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="apps-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Application Detail Modal -->
        <div id="appModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeModal()">&times;</span>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 class="admin-title" style="margin: 0;">Application Details</h2>
                    <button onclick="window.print()" class="submit-btn print-btn"
                        style="width: auto; background: #2196f3;"><i class="fas fa-print"></i> Print Form</button>
                </div>
                <div id="modal-body"></div>
                <div class="modal-footer">
                    <button id="approveBtn" class="submit-btn"
                        style="width: auto; background: #4caf50;">Approve</button>
                    <button id="rejectBtn" class="submit-btn" style="width: auto; background: #f44336;">Reject</button>
                    <button id="deleteBtn" class="submit-btn" style="width: auto; background: #333;">Delete
                        Application</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check Auth Status on Load
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Check Legacy Token
            const token = localStorage.getItem('adminToken');
            if (token) {
                return showDashboard();
            }

            // 2. Check Session Cookie
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.user && data.user.role === 'admin') {
                        return showDashboard();
                    }
                }
            } catch (e) {
                console.log('Session check failed', e);
            }

            showLogin();
        });

        function showLogin() {
            document.getElementById('login-section').style.display = 'block';
            document.querySelector('.main-container').style.display = 'none';
            document.getElementById('logout-item').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.querySelector('.main-container').style.display = 'block';
            document.getElementById('logout-item').style.display = 'block';
            document.getElementById('admissions-nav').style.display = 'block';

            if (document.getElementById('manage-news-section').style.display === 'block') {
                loadAllNews();
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            showLogin();
        }

        // --- Tabs ---
        function switchTab(tabName) {
            // Update Section Visibility
            if (tabName === 'add-news') {
                document.getElementById('add-news-section').style.display = 'block';
                document.getElementById('manage-news-section').style.display = 'none';
                document.getElementById('admissions-section').style.display = 'none';
            } else if (tabName === 'manage-news') {
                document.getElementById('add-news-section').style.display = 'none';
                document.getElementById('manage-news-section').style.display = 'block';
                document.getElementById('admissions-section').style.display = 'none';
                loadAllNews();
            } else if (tabName === 'admissions') {
                document.getElementById('add-news-section').style.display = 'none';
                document.getElementById('manage-news-section').style.display = 'none';
                document.getElementById('admissions-section').style.display = 'block';
                loadApplications('all');
            }

            // Close mobile menu if open
            const nav = document.getElementById('mainNav');
            if (nav.classList.contains('show')) {
                nav.classList.remove('show');
            }

            // Update Tab Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (tabName === 'add-news') document.querySelectorAll('.tab-btn')[0].classList.add('active');
            if (tabName === 'manage-news') document.querySelectorAll('.tab-btn')[1].classList.add('active');
            if (tabName === 'admissions') document.querySelectorAll('.tab-btn')[2].classList.add('active');
        }

        // --- Manage News ---
        async function loadAllNews() {
            const tableBody = document.getElementById('news-table-body');
            const loading = document.getElementById('loading-news');
            const table = document.getElementById('news-table');

            loading.style.display = 'block';
            table.style.display = 'none';
            tableBody.innerHTML = '';

            try {
                const response = await fetch('/api/news?limit=50');
                const data = await response.json();
                const newsItems = data.news || [];

                loading.style.display = 'none';
                table.style.display = 'table';

                if (newsItems.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No news articles found.</td></tr>';
                    return;
                }

                tableBody.innerHTML = newsItems.map(item => `
                    <tr>
                        <td><img src="${item.image || '/placeholder-news.png'}" alt="Thumb" class="news-thumb"></td>
                        <td>${item.title}</td>
                        <td>${formatDate(item.date)}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn edit-btn" onclick="editNews('${item.id}')"><i class="fas fa-edit"></i></button>
                                <button class="action-btn delete-btn" onclick="deleteNews('${item.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error(error);
                loading.textContent = 'Error loading news.';
            }
        }

        // --- Manage Applications ---
        async function loadApplications(filter = 'all') {
            const tbody = document.getElementById('apps-table-body');
            const loading = document.getElementById('loading-apps');
            loading.style.display = 'block';
            tbody.innerHTML = '';

            try {
                const token = localStorage.getItem('adminToken');
                const headers = {};
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const response = await fetch(`/api/admin/actions?status=${filter}`, {
                    headers: headers
                });
                const data = await response.json();
                const applications = data.applications || [];

                loading.style.display = 'none';

                if (applications.length > 0) {
                    tbody.innerHTML = applications.map(app => `
                        <tr>
                            <td>${app.application_number}</td>
                            <td>${app.surname} ${app.other_names}</td>
                            <td>${app.class_applying || app.class}</td>
                            <td><span class="app-status status-${app.status.toLowerCase()}">${app.status}</span></td>
                            <td>
                                <button class="action-btn view-btn" onclick="openAppModal('${app.id}')" title="View Details"><i class="fas fa-eye"></i></button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No applications found.</td></tr>';
                }
            } catch (error) {
                console.error('Error loading applications:', error);
                loading.textContent = 'Error loading applications.';
            }
        }

        async function updateStatus(id, status) {
            if (!confirm(`Are you sure you want to ${status} this application?`)) return;

            const token = localStorage.getItem('adminToken');
            try {
                // CORRECTED ROUTE
                const response = await fetch(`/api/admin/actions?id=${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    loadApplications(); // Refresh the list
                } else {
                    const data = await response.json();
                    alert('Failed to update status: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Error updating status.');
            }
        }

        async function deleteApplication(id) {
            if (!confirm('Are you sure you want to PERMANENTLY delete this application? This action cannot be undone.')) {
                return;
            }

            try {
                const token = localStorage.getItem('adminToken');
                // CORRECTED ROUTE
                const res = await fetch(`/api/admin/actions?id=${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (res.ok) {
                    loadApplications(); // Refresh list
                } else {
                    const data = await res.json();
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error(error);
                alert('Failed to delete.');
            }
        }

        // Modal Functions
        let currentModalAppId = null;

        async function openAppModal(id) {
            console.log('openAppModal called with id:', id);
            currentModalAppId = id;
            const modal = document.getElementById('appModal');
            const modalBody = document.getElementById('modal-body');

            try {
                const token = localStorage.getItem('adminToken');
                const res = await fetch(`/api/admin/actions?id=${id}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) throw new Error('Failed to fetch application details');

                const data = await res.json();
                const app = data.application; // API returns { application: {...} } when ID is provided

                if (!app) throw new Error('Application not found');

                // Render application details in sections
                modalBody.innerHTML = `
                    <div class="modal-section">
                        <h3 class="modal-section-title">Personal Information</h3>
                        <div class="modal-grid">
                            <div class="detail-row"><div class="detail-label">App Number:</div><div>${app.application_number}</div></div>
                            <div class="detail-row"><div class="detail-label">Full Name:</div><div>${app.surname} ${app.other_names}</div></div>
                            <div class="detail-row"><div class="detail-label">DOB / Age:</div><div>${app.dob} (${app.age} years)</div></div>
                            <div class="detail-row"><div class="detail-label">Sex:</div><div>${app.sex}</div></div>
                            <div class="detail-row"><div class="detail-label">LIN:</div><div>${app.lin || 'N/A'}</div></div>
                            <div class="detail-row"><div class="detail-label">Former School:</div><div>${app.former_school}</div></div>
                        </div>
                    </div>

                    <div class="modal-section">
                        <h3 class="modal-section-title">Birth & Origin Details</h3>
                        <div class="modal-grid">
                            <div class="detail-row"><div class="detail-label">Country:</div><div>${app.birth_country}</div></div>
                            <div class="detail-row"><div class="detail-label">District:</div><div>${app.birth_district}</div></div>
                            <div class="detail-row"><div class="detail-label">County:</div><div>${app.birth_county}</div></div>
                            <div class="detail-row"><div class="detail-label">Parish/Village:</div><div>${app.birth_parish} / ${app.birth_village}</div></div>
                        </div>
                    </div>

                    <div class="modal-section">
                        <h3 class="modal-section-title">Admission & Preferences</h3>
                        <div class="modal-grid">
                            <div class="detail-row"><div class="detail-label">Class Applying:</div><div>${app.class_applying}</div></div>
                            <div class="detail-row"><div class="detail-label">Admission Mode:</div><div>${app.admission_mode}</div></div>
                            <div class="detail-row"><div class="detail-label">Parent Category:</div><div>${app.parent_category}</div></div>
                            <div class="detail-row"><div class="detail-label">Status:</div><div>${app.boarding_status} / ${app.day_status}</div></div>
                        </div>
                    </div>

                    <div class="modal-section">
                        <h3 class="modal-section-title">Academic Background (PLE)</h3>
                        <p style="margin-bottom: 10px;"><strong>Year:</strong> ${app.ple_year} | <strong>Index:</strong> ${app.ple_index}</p>
                        <div class="modal-grid">
                            <div class="detail-row"><div class="detail-label">English:</div><div>${app.english_agg}</div></div>
                            <div class="detail-row"><div class="detail-label">Maths:</div><div>${app.maths_agg}</div></div>
                            <div class="detail-row"><div class="detail-label">Science:</div><div>${app.science_agg}</div></div>
                            <div class="detail-row"><div class="detail-label">Social Studies:</div><div>${app.social_agg}</div></div>
                            <div class="detail-row" style="background:#f9f9f9; font-weight:bold;"><div class="detail-label">Total / Div:</div><div>${app.total_aggregates} / Div ${app.division}</div></div>
                        </div>
                    </div>

                    ${app.uce_year ? `
                    <div class="modal-section">
                        <h3 class="modal-section-title">Academic Background (UCE)</h3>
                        <p><strong>Year:</strong> ${app.uce_year} | <strong>Index:</strong> ${app.uce_index}</p>
                        <div style="margin-top:5px; white-space: pre-wrap; font-size: 0.9rem;">${app.uce_results}</div>
                    </div>
                    ` : ''}

                    <div class="modal-section">
                        <h3 class="modal-section-title">Health & Talents</h3>
                        <div class="detail-row"><div class="detail-label">Health Needs:</div><div>${app.health_needs || 'None reported'}</div></div>
                        <div class="detail-row"><div class="detail-label">Talents:</div><div>${app.talents || 'None reported'}</div></div>
                    </div>

                    <div class="modal-section">
                        <h3 class="modal-section-title">Parent/Guardian Information</h3>
                        <div class="modal-grid">
                            <div class="detail-row"><div class="detail-label">Father:</div><div>${app.father_name || 'N/A'} (${app.father_contact || ''})</div></div>
                            <div class="detail-row"><div class="detail-label">Father NIN/Occ:</div><div>${app.father_nin || ''} / ${app.father_occupation || ''}</div></div>
                            <div class="detail-row"><div class="detail-label">Mother:</div><div>${app.mother_name || 'N/A'} (${app.mother_contact || ''})</div></div>
                            <div class="detail-row"><div class="detail-label">Mother NIN/Occ:</div><div>${app.mother_nin || ''} / ${app.mother_occupation || ''}</div></div>
                            <div class="detail-row" style="background:#e8f5e9;"><div class="detail-label">Guardian:</div><div>${app.guardian_name} (${app.guardian_contact})</div></div>
                            <div class="detail-row" style="background:#e8f5e9;"><div class="detail-label">Guardian NIN/Occ:</div><div>${app.guardian_nin} / ${app.guardian_occupation}</div></div>
                        </div>
                    </div>

                    <div class="modal-section">
                        <h3 class="modal-section-title">Attached Documents</h3>
                        <div class="docs-container">
                            ${(app.documents || []).map(doc => `
                                <a href="${doc.url}" target="_blank" class="document-tag">
                                    <i class="fas fa-file-pdf"></i> ${doc.type.replace(/_/g, ' ').toUpperCase()}
                                </a>
                            `).join('') || '<p>No documents attached.</p>'}
                        </div>
                    </div>

                    <div class="modal-section" style="text-align: right; border-top: 1px solid #eee; padding-top: 10px;">
                        <small>Submitted on: ${new Date(app.created_at).toLocaleString()}</small><br>
                        <div class="detail-row" style="justify-content: flex-end; border:none;"><div class="detail-label">Current Status:</div><div><span class="app-status status-${app.status}">${app.status.toUpperCase()}</span></div></div>
                    </div>
                `;

                // Update modal buttons
                document.getElementById('approveBtn').onclick = () => {
                    closeModal();
                    updateStatus(id, 'accepted');
                };
                document.getElementById('rejectBtn').onclick = () => {
                    closeModal();
                    updateStatus(id, 'rejected');
                };
                document.getElementById('deleteBtn').onclick = () => {
                    closeModal();
                    deleteApplication(id);
                };

                modal.style.display = 'block';
            } catch (error) {
                console.error('Error loading application:', error);
                alert('Failed to load application details: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('appModal').style.display = 'none';
            currentModalAppId = null;
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('appModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        async function deleteNews(id) {
            if (!confirm('Are you sure you want to permanently delete this article?')) return;

            const token = localStorage.getItem('adminToken');
            try {
                const response = await fetch(`/api/news/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadAllNews();
                } else {
                    alert('Failed to delete.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function editNews(id) {
            try {
                const response = await fetch(`/api/news/${id}`);
                const data = await response.json();

                document.getElementById('title').value = data.title;
                document.getElementById('summary').value = data.summary;
                document.getElementById('content-editor').innerHTML = data.content;
                document.getElementById('edit-id').value = data.id;

                // Handle image preview for edit
                if (data.image) {
                    const preview = document.getElementById('image-preview');
                    const previewImg = document.getElementById('preview-img');
                    const fileName = document.getElementById('file-name');
                    previewImg.src = data.image;
                    fileName.textContent = 'Current Image';
                    preview.style.display = 'block';
                }

                document.getElementById('form-title').textContent = 'Edit News Article';
                const submitBtn = document.querySelector('#news-form button[type="submit"]');
                submitBtn.textContent = 'Update News Article';
                submitBtn.disabled = false;
                document.getElementById('cancel-edit-btn').style.display = 'inline-block';

                switchTab('add-news');
            } catch (error) {
                alert('Could not load details.');
            }
        }

        function resetForm() {
            document.getElementById('news-form').reset();
            document.getElementById('content-editor').innerHTML = '';
            document.getElementById('edit-id').value = '';
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('upload-status').textContent = 'Click to upload image (JPG, PNG, WebP. Max 5MB)';
            document.getElementById('form-title').textContent = 'Add New News Article';
            const submitBtn = document.querySelector('#news-form button[type="submit"]');
            submitBtn.textContent = 'Publish News Article';
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const passwordEl = document.getElementById('password');
            if (!passwordEl) {
                console.error('Password input not found!');
                alert('Fatal Error: Login form is broken. Please refresh.');
                return;
            }
            const password = passwordEl.value;
            const errorDiv = document.getElementById('login-error');
            const submitBtn = e.target.querySelector('button');

            submitBtn.textContent = 'Verifying...';
            submitBtn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    localStorage.setItem('adminToken', password);
                    showDashboard();
                    document.getElementById('password').value = '';
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'Login failed');
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.textContent = 'Login';
                submitBtn.disabled = false;
            }
        });


        // Editor Functions
        function formatText(command) {
            document.execCommand(command, false, null);
        }

        function formatHeading() {
            document.execCommand('formatBlock', false, 'h3');
        }

        function insertLink() {
            const url = prompt('Enter URL:');
            if (url) {
                document.execCommand('createLink', false, url);
            }
        }

        function insertImage() {
            const url = prompt('Enter image URL:');
            if (url) {
                document.execCommand('insertImage', false, url);
            }
        }

        // Enable submit button
        document.getElementById('news-form').addEventListener('input', function () {
            validateSubmit();
        });

        document.getElementById('content-editor').addEventListener('input', function () {
            validateSubmit();
        });

        function validateSubmit() {
            const submitBtn = document.querySelector('#news-form button[type="submit"]');
            if (!submitBtn || submitBtn.textContent.includes('...')) return;
            const title = document.getElementById('title').value.trim();
            const summary = document.getElementById('summary').value.trim();
            const content = document.getElementById('content-editor').innerHTML.trim();
            submitBtn.disabled = !(title && summary && content);
        }

        // Handle Image Selection and Preview
        document.getElementById('image-input').addEventListener('change', function (e) {
            const file = e.target.files[0];
            const status = document.getElementById('upload-status');
            const preview = document.getElementById('image-preview');
            const previewImg = document.getElementById('preview-img');
            const fileNameDisplay = document.getElementById('file-name');

            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    alert('File is too large! Max 5MB allowed.');
                    this.value = '';
                    return;
                }

                status.textContent = `Selected: ${file.name}`;
                fileNameDisplay.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;

                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                status.textContent = 'Click to upload image (JPG, PNG, WebP. Max 5MB)';
                preview.style.display = 'none';
            }
            validateSubmit();
        });

        // Handle news submission
        document.getElementById('news-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const summary = document.getElementById('summary').value.trim();
            const content = document.getElementById('content-editor').innerHTML.trim();
            const fileInput = document.getElementById('image-input');
            const editId = document.getElementById('edit-id').value;
            const submitBtn = document.querySelector('#news-form button[type="submit"]');

            const token = localStorage.getItem('adminToken');
            if (!token) { logout(); return; }

            if (title && summary && content) {
                submitBtn.disabled = true;
                const originalBtnText = submitBtn.textContent;
                submitBtn.textContent = editId ? 'Updating...' : 'Publishing...';

                try {
                    const formData = new FormData();
                    formData.append('title', title);
                    formData.append('summary', summary);
                    formData.append('content', content);

                    if (fileInput.files[0]) {
                        formData.append('image', fileInput.files[0]);
                    }

                    const method = editId ? 'PUT' : 'POST';
                    const url = editId ? `/api/news/${editId}` : '/api/news';

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error || 'Failed to save article');
                    }

                    alert(editId ? 'News article updated successfully!' : 'News article published successfully!');
                    resetForm();
                    if (editId) switchTab('manage-news');

                } catch (error) {
                    console.error('Submission error:', error);
                    alert(`Error: ${error.message}`);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                }
            }
        });

        // Mobile menu toggle
        document.getElementById('menuToggle').addEventListener('click', function () {
            const nav = document.getElementById('mainNav');
            nav.classList.toggle('show');
        });
    </script>
</body>
