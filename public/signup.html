<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MABSS Admission</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid #006400;
        }

        h1 {
            color: #006400;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #006400;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #004d00;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            display: none;
        }

        .success {
            color: green;
            margin-bottom: 10px;
            display: none;
        }

        .links {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        a {
            color: #006400;
            text-decoration: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #666;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider span {
            padding: 0 10px;
            font-size: 0.9rem;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: #444;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .google-btn:hover {
            background: #f8f8f8;
            border-color: #ccc;
        }

        .google-btn svg {
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h1>Create Account</h1>
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <!-- Google Sign-In Button -->
        <div id="g_id_onload" data-client_id="1066040941987-6fotl7k1qvcgtb3snt87lr4i1ujm21oj.apps.googleusercontent.com"
            data-callback="handleGoogleCallback" data-auto_prompt="false">
        </div>
        <button class="google-btn" id="googleSignIn">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Continue with Google
        </button>

        <div class="divider">
            <span>OR</span>
        </div>

        <form id="signupForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password (Min 6 chars)" required minlength="6">
            <button type="submit">Sign Up</button>
        </form>
        <div class="links">
            <p>Already have an account? <a href="login.html">Login</a></p>
            <p><a href="index.html">Back to Home</a></p>
        </div>
    </div>

    <!-- Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        // Google Sign-In Callback
        async function handleGoogleCallback(response) {
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();

                if (res.ok) {
                    if (data.isNewUser) {
                        successDiv.textContent = '✓ Account created successfully! Redirecting to admission form...';
                        successDiv.style.display = 'block';
                    } else {
                        successDiv.textContent = '✓ Welcome back! Account already exists. Logging you in...';
                        successDiv.style.display = 'block';
                    }

                    // Redirect to admission
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirect = urlParams.get('redirect');
                        window.location.href = redirect === 'admission' ? 'admission/index.html' : 'admission/index.html';
                    }, 1500);
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                errorDiv.textContent = err.message || 'Google sign-in failed';
                errorDiv.style.display = 'block';
            }
        }

        // Manual Google Sign-In button click
        document.getElementById('googleSignIn').addEventListener('click', () => {
            google.accounts.id.initialize({
                client_id: document.querySelector('[data-client_id]').getAttribute('data-client_id'),
                callback: handleGoogleCallback
            });
            google.accounts.id.prompt();
        });

        // Regular form signup
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerText = 'Creating Account...';
            errorDiv.style.display = 'none';

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // Check for redirect parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');

                    // Auto-redirect to admission
                    window.location.href = redirect === 'admission' ? 'admission/index.html' : 'admission/index.html';
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Sign Up';
            }
        });
    </script>
</body>

</html>
