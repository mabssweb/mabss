<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Admission Status - MABSS</title>
    <!-- Reuse styles from index.html or simple clean style -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #006400;
        }

        h1 {
            color: #006400;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #006400;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #004d00;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #e8f4e8;
            color: #006400;
            border: 1px solid #006400;
        }

        .error {
            background: #fee;
            color: #c00;
            border: 1px solid #c00;
        }

        .home-link {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Check Admission Status</h1>
        <p>Enter your Application Number or LIN</p>
        <form id="statusForm" onsubmit="checkStatus(event)">
            <input type="text" id="refInput" placeholder="MABSS-2026-XXXX or LIN" required>
            <button type="submit" id="btn">Check Status</button>
        </form>
        <div id="result" class="result"></div>
        <a href="index.html" class="home-link">Back to Admission Form</a>
        <a href="../index.html" class="home-link">Home</a>
    </div>

    <script>
        async function checkStatus(e) {
            e.preventDefault();
            const ref = document.getElementById('refInput').value.trim();
            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');

            if (!ref) return;

            btn.disabled = true;
            btn.textContent = 'Checking...';
            resultDiv.style.display = 'none';
            resultDiv.className = 'result';

            try {
                const response = await fetch(`/api/admission/status?ref=${encodeURIComponent(ref)}`);
                const data = await response.json();

                resultDiv.style.display = 'block';

                if (response.ok && data.found) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>Application Found!</strong><br>
                        Name: ${data.application.surname} ${data.application.other_names}<br>
                        Status: <span style="text-transform: uppercase; font-weight: bold;">${data.application.status}</span><br>
                        Submitted: ${new Date(data.application.created_at).toLocaleDateString()}
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = data.error || 'Application not found.';
                }
            } catch (err) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error connecting to server.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Check Status';
            }
        }
    </script>
</body>

</html>
